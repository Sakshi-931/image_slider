<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Slider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="reel">
  <div class="reel-label">
    <span>frame <span class="frame-count" id="frameCount">01 / 05</span></span>
    <span id="frameTitle">—</span>
  </div>

  <div class="stage">
    <div class="sprockets top"></div>
    <div class="sprockets bottom"></div>

    <div class="track" id="track"></div>

    <button class="nav-btn prev" id="prevBtn" aria-label="Previous image">&#8249;</button>
    <button class="nav-btn next" id="nextBtn" aria-label="Next image">&#8250;</button>
  </div>

  <div class="controls" id="dots"></div>
</div>

<script src="script.js"></script>
</body>
</html>
